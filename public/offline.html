<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sicasa Cafe - Mode Offline</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F0F1EA;
            color: #17191C;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(24, 43, 135, 0.08);
            border: 1px solid rgba(0,0,0,0.06);
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            background: #FFF8E7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: #D97706;
        }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #182B87;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            color: #6B7280;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn-retry {
            background-color: #182B87;
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 15px;
            padding: 14px 28px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(24, 43, 135, 0.2);
        }
        .btn-retry:hover {
            background-color: #0F1D5E;
            transform: translateY(-1px);
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #FEE2E2;
            color: #991B1B;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: #EF4444;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-circle">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>
        <div class="status-pill">
            <span class="dot"></span>
            <span>Tidak Ada Koneksi Internet</span>
        </div>
        <h1>Kamu Sedang Offline</h1>
        <p>Aplikasi Sicasa Cafe tetap terpasang di perangkatmu. Silakan periksa jaringan Wi-Fi atau data seluler kamu untuk melanjutkan transaksi.</p>
        <button class="btn-retry" onclick="window.location.reload()">
            Coba Hubungkan Ulang
        </button>
    </div>
</body>
</html>
